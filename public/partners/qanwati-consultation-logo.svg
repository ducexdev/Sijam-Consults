<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="100%" height="100%">
  <defs>
    <linearGradient id="qGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="qGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="qGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="480" height="140" rx="16" fill="#0A0A0E" />
  <rect x="1" y="1" width="478" height="138" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Emblem / Crest Group -->
  <g transform="translate(24, 20)">
    <!-- Hexagonal Shield -->
    <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" fill="#052E16" stroke="url(#qGold)" stroke-width="2.5" />
    <!-- Inner Accent Shield -->
    <polygon points="50,14 82,30 82,70 50,86 18,70 18,30" fill="#064E3B" opacity="0.6" />
    
    <!-- Stylized Palm Tree Symbol -->
    <!-- Trunk -->
    <path d="M47,74 Q50,56 50,46 Q50,56 53,74 Z" fill="url(#qGold)" />
    <!-- Fronds -->
    <path d="M50,46 Q40,34 26,42 Q38,40 48,48 Z" fill="url(#qGold)" />
    <path d="M50,46 Q60,34 74,42 Q62,40 52,48 Z" fill="url(#qGold)" />
    <path d="M50,45 Q44,28 34,32 Q42,32 49,44 Z" fill="url(#qGold)" />
    <path d="M50,45 Q56,28 66,32 Q58,32 51,44 Z" fill="url(#qGold)" />
    <path d="M50,44 Q50,22 50,20 Q50,22 50,44 Z" stroke="url(#qGold)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Crossed Swords base -->
    <path d="M30,76 L70,76" stroke="url(#qGold)" stroke-width="2" stroke-linecap="round" />
    <circle cx="50" cy="76" r="3" fill="url(#qGold)" />
  </g>

  <!-- Typography Group -->
  <!-- Arabic Calligraphic Title -->
  <text x="140" y="44" font-family="'Cairo', 'Amiri', 'Traditional Arabic', sans-serif" font-size="16" font-weight="700" fill="#FCD34D" letter-spacing="1">
    قنواتي للاستشارات وتوفير الكوادر
  </text>

  <!-- English Corporate Name -->
  <text x="140" y="76" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
    QANWATI
    <tspan fill="#FCD34D" font-weight="700"> CONSULTATION</tspan>
  </text>

  <!-- Tagline & Territory -->
  <text x="140" y="98" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="2">
    MANPOWER &amp; RECRUITMENT SERVICES
  </text>

  <g transform="translate(140, 108)">
    <rect x="0" y="0" width="138" height="18" rx="9" fill="#064E3B" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
    <circle cx="9" cy="9" r="3.5" fill="#10B981" />
    <text x="18" y="12.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#A7F3D0" letter-spacing="1">
      SAUDI ARABIA 🇸🇦 &amp; GCC
    </text>
  </g>
</svg>
